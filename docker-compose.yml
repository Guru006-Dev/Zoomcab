# Three backend instances + Redis + nginx load balancer.
#   JWT_SECRET=<long random string> docker compose up --build
#   open http://localhost:8080
x-api: &api
  build: ./backend
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  environment: &api-env
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a long random string before docker compose up}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    DB_PATH: /data/zoomcab.db
    DEMO_MODE: ${DEMO_MODE:-true}
    # Local demo cluster: create the demo logins. Set to false for anything public.
    SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  volumes:
    - db-data:/data

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1
  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
  api-3:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-3

  web:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3

volumes:
  db-data:
