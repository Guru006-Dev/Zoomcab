# Three backend instances + Postgres (PostGIS) + Redis + nginx load balancer.
# For local development you can also start just the databases:
#   docker compose up -d postgres redis
#   JWT_SECRET=<long random string> docker compose up --build
#   open http://localhost:8080
x-api: &api
  build: ./backend
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &api-env
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a long random string before docker compose up}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    DATABASE_URL: postgres://zoomcab:zoomcab@postgres:5432/zoomcab
    DEMO_MODE: ${DEMO_MODE:-true}
    # Local demo cluster: create the demo logins. Set to false for anything public.
    SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: zoomcab
      POSTGRES_PASSWORD: zoomcab
      POSTGRES_DB: zoomcab
    ports:
      - "5432:5432"   # exposed for local development and tests
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zoomcab"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "6379:6379"   # exposed for local development and tests

  api-1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-1
  api-2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
  api-3:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-3

  web:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3

volumes:
  pg-data:
