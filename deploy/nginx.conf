# Load balancer in front of the backend instances.
# Clients use WebSocket-only Socket.IO, so plain round-robin works without sticky sessions:
# each socket stays on the instance it connected to, and the Redis adapter delivers
# events across instances.
upstream zoomcab_api {
    server api-1:5000 max_fails=1 fail_timeout=5s;
    server api-2:5000 max_fails=1 fail_timeout=5s;
    server api-3:5000 max_fails=1 fail_timeout=5s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://zoomcab_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Retry on another instance if one is down (safe for the demo; POSTs are not retried).
        proxy_next_upstream error timeout;
    }

    location /socket.io/ {
        proxy_pass http://zoomcab_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
