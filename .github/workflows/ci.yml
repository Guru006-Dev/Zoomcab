name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DATABASE_URL: postgres://zoomcab:zoomcab@localhost:5432/zoomcab

jobs:
  backend-postgres:
    name: Backend tests (Postgres, no Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: zoomcab
          POSTGRES_PASSWORD: zoomcab
          POSTGRES_DB: zoomcab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zoomcab"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  backend-redis:
    name: Backend tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: zoomcab
          POSTGRES_PASSWORD: zoomcab
          POSTGRES_DB: zoomcab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zoomcab"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REQUIRE_REDIS: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
